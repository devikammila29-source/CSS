<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:580px;
            width:70vw;
            border: 10px;
            display:grid;
             grid-template-columns: repeat(4,250px);
             grid-template-rows:60px 200px 200px 60px;
             gap: 20px;
        }
        .box{
            background-color: red;
            border:3px solid whitesmoke;
            color:white;
            border-radius: 10px;
        }
        .box1{
            background-color: rgb(10, 84, 84);
            grid-column-start: 1;
            grid-column-end: 6;
             color:white;
            text-align: center;
            box-sizing: border-box;
            padding-top: 10px;
            border:10px;
            font-size: 40px;
             border-radius: 5px;
        }
        .one{
            background-color: skyblue;
            grid-column-start: 1;
            grid-column-end: 3;
             color:white;
            text-align:center;
             box-sizing: border-box;
            padding-top: 100px;
            padding-left:50PX;
            font-size: 20px;
            border:10px;
             border-radius: 10px;
        }
        .two{
            background-color: rgb(21, 223, 28);
            grid-column-start: 3;
            grid-column-end:4;
             color:white;
            text-align: center;
             box-sizing: border-box;
            padding-top: 80px;
            padding-left:10PX;
            font-size:20px;
             border-radius: 10px;
        }
        .three{
            background-color: violet;
            grid-column-start:4;
            grid-column-end: 6;
            grid-row:2/4;
            text-align: center;
             color:white;
            box-sizing: border-box;
            padding-top: 180px;
            padding-left: 20PX;
            font-size: 20px;
             border-radius: 10px;
        }
        .four{
            background-color:darkorchid;
            grid-column-start:1;
            grid-column-end: 2;
             color:white;
            text-align: center;
            box-sizing: border-box;
            padding-top: 80px;
            padding-left: 10PX;
            font-size: 20px;
             border-radius: 10px;
        }
        .five{
            background-color:orange;
            grid-column-start:2;
            grid-column-end: 3;
             color:white;
            text-align: center;
            box-sizing: border-box;
            padding-top: 80px;
            padding-left: 10PX;
             font-size: 20px;
             border-radius: 10px;
        }
        .six{
            background-color: rgb(12, 210, 115);
            grid-column-start:3;
            grid-column-end: 4;
            color:white;
            text-align: center;
            box-sizing: border-box;
            padding-top: 80px;
            padding-left: 10PX;
             font-size: 20px;
             border-radius: 10px;
        }
        .seven{
            background-color: rgb(10, 84, 84);
            grid-column-start: 1;
            grid-column-end: 6;
            color:white;
            text-align: center;
            box-sizing: border-box;
            padding-top: 10px;
            border:10px;
            font-size: 30px;
             border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Headline</div>
        <div class="box one">News 1</div>
        <div class="box two">News 2</div>
        <div class="box three">Advertisements</div>
        <div class="box four">New 3</div>
        <div class="box five">News 4</div>
        <div class="box six">News 5</div>
        <div class="box seven">footer</div>
    </div>
</body>
</html>
