<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
            box-sizing: border-box;
        }
        body{
            height:100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: navy;
        }
        .parent{
            height:200px;
            width:200px;
            perspective: 800px;
        }
        .container{
            height:200px;
            width:200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform-style: preserve-3d;
            animation: cube 10s linear  infinite ;
        }
        .box{
            height:200px;
            width:200px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight:bold;
            opacity: 1;
            color:white;
            position:absolute;
            border:1px solid rgb(19, 3, 124); 
        }
        .box1{
            background-color: red;
            transform: translateZ(100px);
        }
        .box2{
            background-color: rgba(0, 0, 255, 0.722);
            transform: rotateY(180deg) translateZ(100px);
        }
        .box3{
            background-color: rgb(251, 102, 10);
            transform: rotateY(-90deg) translateZ(100px);
        }
        .box4{
            background-color: rgb(222, 25, 94);
            transform: rotateY(90deg) translateZ(100px);
        }
        .box5{
            background-color: rgb(231, 194, 46);
            transform: rotateX(90deg) translateZ(100px);
        }
        .box6{
            background-color:green;
            transform: rotateX(-90deg) translateZ(100px);
        }
        @keyframes cube{
            from {
                transform: rotateX(0deg) rotateY(0deg) ;
            }
            to {
                transform: rotateX(360deg) rotateY(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="container">
    <div class="box box1">Front</div>
    <div class="box box2">Back</div>
    <div class="box box3">Left</div>
    <div class="box box4">Right</div>
    <div class="box box5">Top</div>
    <div class="box box6">Bottom</div>
    </div>
    </div>
</body>
</html>
