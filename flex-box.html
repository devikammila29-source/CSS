<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:500px;
            width:500px;
            border:4px solid blue;
            box-shadow: 2px 2px 2px 2px blue;
            border-radius: 50%;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: rgb(168, 213, 231);
            text-shadow: 2px 2px 2px 2px blueviolet;
        }
        .child{
            height:300px;
            width:300px;
            border:4px solid red;
            border-radius: 50%;
            box-shadow: 2px 2px 2px 2px red;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            background-color: pink;
        }
        .one{
             height:100px;
            width:100px;
            border:4px solid green;
            border-radius: 50%;
            box-shadow: 2px 2px 2px 2px green;
            text-align: center;
            padding-top: 20px;
            box-sizing: border-box;
            background-color: rgb(162, 231, 162);
             text-shadow: 2px 2px 2px blueviolet;
            color:navy;
        }
        div{
            height:600px;
            width:550px;
            border: 3px solid navy;
            background-color: gainsboro;
            border-radius: 10px;
            display: flex;
            flex-direction: center;
        }
    </style>
</head>
<body>
   <div>
     <div class="container">
        <div class="child">
            <div class="one">Fullstack Developer</div>
        </div>
    </div>
   </div>
</body>
</html>
